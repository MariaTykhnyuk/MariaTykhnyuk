{% extends "encyclopedia/layout.html" %}

{% block title %}
    Search
{% endblock %}

{% block body %}
    <h1>Search Results</h1>

    <p>Results for: <strong>{{ query }}</strong></p>

    {% if results %}
        <ul>
            {% for entry in results %}
                <li>
                    <a href="{% url 'entry' entry %}">
                        {{ entry }}
                    </a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No matching pages found.</p>
    {% endif %}
{% endblock %}
