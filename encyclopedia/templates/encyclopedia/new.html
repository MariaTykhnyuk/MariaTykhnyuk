{% extends "encyclopedia/layout.html" %}

{% block title %}
    Encyclopedia
{% endblock %}

{% block body %}
    <h1>Create New Page</h1>

    <form action="{% url 'new' %}" method="POST">
        {% csrf_token %}
        Entry title:
        </br>
        <input type="text" name="title">
        </br>
        Entry Content:
        </br>
        <textarea name="content"></textarea>
        </br>
        <input type="submit">
    </form>

{% endblock %}
