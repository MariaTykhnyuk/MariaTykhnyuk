{% extends "encyclopedia/layout.html" %}

{% block title %}
    Search
{% endblock %}

{% block body %}
    <h1>Search</h1>
{% if isFound %}
    <ul>
        {% for entry in entries %}
            <li>
                <a href="{% url 'open_page' entry %}">
                {{ entry }}</a>

            </li>
        {% endfor %}
    </ul>
{% else %}
<h2>Not Found</h2>
{% endif %}
{% endblock %}
