{% extends "encyclopedia/layout.html" %}

{% block title %}
    Create new page
{% endblock %}

{% block body %}
    <h1>Create new page</h1>

  <form action="{% url 'create_page' %}" method="post">
      {% csrf_token %}
      <label style="color: #ff4c4a">{{ mistake }}</label>
      <br><br>
      <input type="text" name="name_page" placeholder="Name your page" value={{name}}>
      <br><br>
      <textarea name="description" rows="10" cols="80" placeholder="Enter description" >{{content}}</textarea>
      <br><br>
      <button>
          Create new page
      </button>
  </form>

{% endblock %}
